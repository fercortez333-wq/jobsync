# Used only in GitHub Codespaces: puts a small relay in front of JobSync.
services:
  app:
    ports: !reset []
  proxy:
    image: nginx:alpine
    container_name: jobsync_proxy
    ports:
      - "3737:80"
    volumes:
      - ./.devcontainer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
