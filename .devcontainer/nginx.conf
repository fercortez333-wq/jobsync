# Codespaces rewrites the Origin header to localhost:3737, so JobSync (Next.js)
# rejects form submissions. This relay makes the Host header match it.
server {
  listen 80;
  client_max_body_size 25m;
  location / {
    proxy_pass http://app:3737;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:3737;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
